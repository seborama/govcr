version: "3.8"

## this file starts local AWS-compatible services for development

services:
  ministack:
    container_name: "${MINISTACK_DOCKER_NAME-ministack_main}"
    image: ministackorg/ministack:1.3.9
    ports:
      - "127.0.0.1:4566:4566"
    environment:
      - LOG_LEVEL=${LOG_LEVEL-WARNING}
      - PERSIST_STATE=${PERSIST_STATE-1}
      - S3_PERSIST=${S3_PERSIST-1}
      - DOCKER_HOST=unix:///var/run/docker.sock
    volumes:
      - "${MINISTACK_STATE_DIR:-/tmp/lima/govcr/ministack-state}:/tmp/ministack-state"
      - "${MINISTACK_S3_DATA_DIR:-/tmp/lima/govcr/ministack-s3}:/tmp/ministack-data/s3"
      - "/var/run/docker.sock:/var/run/docker.sock"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:4566/_ministack/health')"]
      interval: 10s
      timeout: 3s
      retries: 3
