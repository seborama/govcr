name: Lint and Test

on:
  push:
    branches: [ master ]
  pull_request:
    branches: [ master ]

jobs:

  lint:
    name: Linting
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Lint and Vet
        uses: golangci/golangci-lint-action@v7
        with:
          version: latest
          args: --timeout=3m

  test:
    name: Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Start MiniStack
        run: |
          docker run -d \
            --name ministack \
            -p 4566:4566 \
            -e LOG_LEVEL=WARNING \
            ministackorg/ministack:1.3.9

          echo "Waiting for MiniStack startup..."
          for i in {1..30}; do
            if curl -fsS http://localhost:4566/_ministack/health >/dev/null; then
              echo "Startup complete"
              exit 0
            fi
            sleep 1
          done

          docker logs ministack
          exit 1

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '^1.25'

      - name: Test
        run: make test
        env:
          AWS_ENDPOINT_URL: http://localhost:4566
          AWS_DEFAULT_REGION: eu-west-1
          AWS_ACCESS_KEY_ID: test
          AWS_SECRET_ACCESS_KEY: test
